<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1051px;height:832px;background:#FFFFFF;" width="1051px" height="832px" viewBox="0 0 1051 832" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="4"><text x="349.526" y="22.674" fill="#000" font-size="14" textLength="345.447" font-weight="700" font-family="Arial">State machine — Trip lifecycle and GPS signal state</text></g><g class="entity" data-qualified-name="Active" id="ent0001" data-source-line="8"><path d="M18.5,141.641 L650,141.641 A12.5,12.5 0 0 1 662.5,154.141 L662.5,167.281 L6,167.281 L6,154.141 A12.5,12.5 0 0 1 18.5,141.641" fill="#F1F1F1"/><rect x="6" y="141.641" width="656.5" height="494.641" fill="none" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="6" y1="167.281" x2="662.5" y2="167.281" style="stroke:#181818;stroke-width:0.5;"/><text x="315.188" y="159.314" fill="#000" font-size="14" textLength="38.124" font-family="Arial">Active</text><g class="entity" data-qualified-name="Active.AwaitingFix" id="ent0002" data-source-line="10"><rect x="373.5" y="239.281" width="269.601" height="51.281" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="373.5" y1="264.922" x2="643.101" y2="264.922" style="stroke:#181818;stroke-width:0.5;"/><text x="472.511" y="256.955" fill="#000" font-size="14" textLength="71.579" font-family="Arial">AwaitingFix</text><text x="378.5" y="282.596" fill="#000" font-size="14" textLength="249.601" font-family="Arial">do / show "waiting for first GPS position"</text></g><g class="entity" data-qualified-name="Active.Live" id="ent0003" data-source-line="11"><rect x="143" y="344.281" width="289.274" height="66.922" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="143" y1="369.922" x2="432.274" y2="369.922" style="stroke:#181818;stroke-width:0.5;"/><text x="274.796" y="361.955" fill="#000" font-size="14" textLength="25.683" font-family="Arial">Live</text><text x="148" y="387.596" fill="#000" font-size="14" textLength="138.489" font-family="Arial">entry / show live ETAs</text><text x="148" y="403.236" fill="#000" font-size="14" textLength="269.274" font-family="Arial">fix accepted / update position, speed, ETAs</text></g><g class="entity" data-qualified-name="Active.Stale" id="ent0004" data-source-line="13"><rect x="12" y="465.281" width="239.037" height="51.281" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="12" y1="490.922" x2="251.037" y2="490.922" style="stroke:#181818;stroke-width:0.5;"/><text x="115.563" y="482.955" fill="#000" font-size="14" textLength="31.91" font-family="Arial">Stale</text><text x="17" y="508.596" fill="#000" font-size="14" textLength="219.037" font-family="Arial">do / show ETAs as approximate (~)</text></g><g class="entity" data-qualified-name="Active.Lost" id="ent0005" data-source-line="14"><rect x="273.5" y="570.281" width="222.152" height="51.281" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="273.5" y1="595.922" x2="495.652" y2="595.922" style="stroke:#181818;stroke-width:0.5;"/><text x="371.345" y="587.955" fill="#000" font-size="14" textLength="26.462" font-family="Arial">Lost</text><text x="278.5" y="613.596" fill="#000" font-size="14" textLength="202.152" font-family="Arial">do / hide ETAs, show "last seen"</text></g><g class="start_entity" data-qualified-name="Active..start.Active" id="ent0008" data-source-line="9"><ellipse cx="508.5" cy="188.281" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="link" data-entity-1="ent0008" data-entity-2="ent0002" id="lnk9" data-link-type="dependency"><polygon points="508.5,239.127,512.5,230.127,508.5,234.127,504.5,230.127,508.5,239.127" fill="#181818" style="s