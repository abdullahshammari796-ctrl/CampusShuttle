link-type="dependency"><polygon points="348.44,570.278,343.903,561.537,344.533,567.159,338.911,567.789,348.44,570.278" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M284.614,411.365 C283.442,440.383 285.236,483.235 301.5,516.281 C312.097,537.813 327.312,553.408 344.533,567.159" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="351.209" y="481.05" fill="#000" font-size="13" textLength="59.243" font-family="Arial">after(60 s)</text><text x="303.5" y="495.573" fill="#000" font-size="13" textLength="154.661" font-family="Arial">[e.g. an old offline backlog,</text><text x="312.92" y="510.097" fill="#000" font-size="13" textLength="135.821" font-family="Arial">or after a server restart]</text></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk14" data-link-type="dependency"><polygon points="273.322,588.861,264.75,584.012,268.346,588.379,263.979,591.975,273.322,588.861" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M127.036,516.365 C126.271,528.617 127.813,542.801 136.5,552.281 C155.24,572.732 211.445,582.87 268.346,588.379" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="138.5" y="548.05" fill="#000" font-size="13" textLength="133.656" font-family="Arial">after(60 s since last fix)</text></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0003" id="lnk15" data-link-type="dependency"><polygon points="227.563,411.509,217.796,412.776,223.293,414.111,221.959,419.608,227.563,411.509" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M157.046,465.259 C169.647,453.727 185.36,440.156 200.5,429.281 C209.011,423.168 214.041,419.748 223.293,414.111" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="202.5" y="443.05" fill="#000" font-size="13" textLength="69.374" font-family="Arial">fix accepted</text></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0003" id="lnk16" data-link-type="dependency"><polygon points="396.592,411.315,402.777,418.979,401.042,413.595,406.426,411.859,396.592,411.315" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M415.801,570.2 C445.24,543.975 481.722,501.331 459.5,465.281 C444.855,441.523 425.914,426.341 401.042,413.595" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="468.5" y="495.55" fill="#000" font-size="13" textLength="69.374" font-family="Arial">fix accepted</text></g></g><g class="start_entity" data-qualified-name=".start." id="ent0006" data-source-line="6"><ellipse cx="334.5" cy="58.641" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="Completed" id="ent0017" data-source-line="25"><rect x="158.5" y="705.641" width="87.703" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="158.5" y1="731.281" x2="246.203" y2="731.281" style="stroke:#181818;stroke-width:0.5;"/><text x="168.5" y="723.314" fill="#000" font-size="14" textLength="67.703" font-family="Arial">Completed</text></g><g class="entity" data-qualified-name="Terminated" id="ent0019" data-source-line="26"><rect x="289" y="705.641" width="90.807" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="289" y1="731.281" x2="379.807" y2="731.281" style="stroke:#181818;stroke-width:0.5;"/><text x="299" y="723.314" fill="#000" font-size="14" textLength="70.807" font-family="Arial">Terminated</text></g><g class="end_entity" data-qualified-name=".end." id="ent0022" data-source-line="28"><ellipse cx="281.5" cy="803.641" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="281.5" cy="803.641" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN25" id="ent0026" data-source-line="32"><path d="M681.5,311.641 L681.5,385.141 L663.023,389.141 L681.5,393.141 L681.5,466.875 A0,0 0 0 0 681.5,466.875 L1035.523,466.875 A0,0 0 0 0 1035.523,466.875 L1035.523,321.641 L1025.523,311.641 L681.5,311.641 A0,0 0 0 0 681.5,311.641" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1025.523,311.641 L1025.523,321.641 L1035.523,321.641 L1025.523,311.641" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="687.5" y="328.409" fill="#000" font-size="13" textLength="209.549" font-family="Arial">Ages are measured from the newest</text><text x="687.5" y="342.933" fill="#000" font-size="13" textLength="208.063" font-family="Arial">accepted fix (server-corrected time),</text><text x="687.5" y="357.456" fill="#000" font-size="13" textLength="205.918" font-family="Arial">or from the trip start if there is none.</text><text x="687.5" y="371.979" fill="#000" font-size="13" textLength="161.148" font-family="Arial">Thresholds are configurable</text><text x="687.5" y="386.503" fill="#000" font-size="13" textLength="333.023" font-family="Arial">(STALE_AFTER_SECONDS, LOST_AFTER_SECONDS,</text><text x="687.5" y="401.026" fill="#000" font-size="13" textLength="283.175" font-family="Arial">ABANDON_AFTER_MINUTES). A trip recovered</text><text x="687.5" y="415.55" fill="#000" font-size="13" textLength="216.036" font-family="Arial">after a restart re-enters Live if it has a</text><text x="687.5" y="430.073" fill="#000" font-size="13" textLength="251.45" font-family="Arial">stored position (otherwise AwaitingFix), and</text><text x="687.5" y="444.597" fill="#000" font-size="13" textLength="249.26" font-family="Arial">recover() re-evaluates it immediately, so an</text><text x="687.5" y="459.12" fill="#000" font-size="13" textLength="258.686" font-family="Arial">old position moves it straight to Stale or Lost.</text></g><g class="link" data-entity-1="ent0006" data-entity-2="ent0001" id="lnk7" data-link-type="dependency"><polygon points="334.5,141.489,338.5,132.489,334.5,136.489,330.5,132.489,334.5,141.489" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M334.5,72.879 C334.5,86.504 334.5,106.415 334.5,136.489" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="384.923" y="104.409" fill="#000" font-size="13" textLength="131.485" font-family="Arial">startTrip(route, shuttle)</text><text x="336.5" y="118.933" fill="#000" font-size="13" textLength="228.332" font-family="Arial">[route in service, shuttle and driver free]</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0017" id="lnk18" data-link-type="dependency"><polygon points="196.691,705.346,199.078,695.791,195.828,700.421,191.198,697.171,196.691,705.346" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M201.303,636.878 C199.556,642.804 197.949,648.73 196.5,654.641 C192.425,671.26 193.229,685.585 195.828,700.421" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="198.5" y="675.909" fill="#000" font-size="13" textLength="130.032" font-family="Arial">endTrip() [by its driver]</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0019" id="lnk20" data-link-type="dependency"><polygon points="334.5,705.293,338.5,696.293,334.5,700.293,330.5,696.293,334.5,705.293" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M334.5,636.871 C334.5,664.431 334.5,683.557 334.5,700.293" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="336.5" y="675.909" fill="#000" font-size="13" textLength="161.846" font-family="Arial">terminate(reason) [by office]</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0019" id="lnk21" data-link-type="dependency"><polygon points="380.04,724.383,389.506,727.103,384.992,723.693,388.402,719.179,380.04,724.383" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M520.42,636.726 C519.176,654.375 513.