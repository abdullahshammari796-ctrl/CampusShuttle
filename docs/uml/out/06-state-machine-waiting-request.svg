<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:556px;height:461px;background:#FFFFFF;" width="556px" height="461px" viewBox="0 0 556 461" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="4"><text x="97.94" y="22.674" fill="#000" font-size="14" textLength="353.438" font-weight="700" font-family="Arial">State machine — Waiting request ("I'm waiting here")</text></g><g class="entity" data-qualified-name="Waiting" id="ent0001" data-source-line="7"><rect x="119.396" y="200.641" width="192.765" height="51.281" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="119.396" y1="226.281" x2="312.161" y2="226.281" style="stroke:#181818;stroke-width:0.5;"/><text x="192.437" y="218.314" fill="#000" font-size="14" textLength="46.683" font-family="Arial">Waiting</text><text x="124.396" y="243.955" fill="#000" font-size="14" textLength="172.765" font-family="Arial">entry / publish waiting count</text></g><g class="entity" data-qualified-name="Retention" id="ent0002" data-source-line="18"><path d="M243.896,48.641 L243.896,131.258 L550.319,131.258 L550.319,58.641 L540.319,48.641 L243.896,48.641" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M540.319,48.641 L540.319,58.641 L550.319,58.641 L540.319,48.641" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="249.896" y="65.409" fill="#000" font-size="13" textLength="259.416" font-family="Arial">For Served, Cancelled and Expired requests:</text><text x="249.896" y="79.933" fill="#000" font-size="13" textLength="274.612" font-family="Arial">24 h after closing, the pseudonymous requester</text><text x="249.896" y="94.456" fill="#000" font-size="13" textLength="285.422" font-family="Arial">reference is erased (retention job). The remaining</text><text x="249.896" y="108.979" fill="#000" font-size="13" textLength="276.009" font-family="Arial">row (stop, route, time, outcome) is non-personal</text><text x="249.896" y="123.503" fill="#000" font-size="13" textLength="251.488" font-family="Arial">demand data used for trends and forecasts.</text></g><g class="start_entity" data-qualified-name=".start." id="ent0003" data-source-line="6"><ellipse cx="215.896" cy="88.141" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="Served" id="ent0006" data-source-line="9"><rect x="48.896" y="334.641" width="64.358" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="48.896" y1="360.281" x2="113.255" y2="360.281" style="stroke:#181818;stroke-width:0.5;"/><text x="58.896" y="352.314" fill="#000" font-size="14" textLength="44.358" font-family="Arial">Served</text></g><g class="entity" data-qualified-name="Cancelled" id="ent0008" data-source-line="10"><rect x="174.896" y="334.641" width="82.262" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="174.896" y1="360.281" x2="257.158" y2="360.281" style="stroke:#181818;stroke-width:0.5;"/><text x="184.896" y="352.314" fill="#000" font-size="14" textLength="62.262" font-family="Arial">Cancelled</text></g><g class="entity" data-qualified-name="Expired" id="ent0011" data-source-line="12"><rect x="366.396" y="334.641" width="67.469" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="366.396" y1="360.281" x2="433.865" y2="360.281" style="stroke:#181818;stroke-width:0.5;"/><text x="376.396" y="352.314" fill="#000" font-size="14" textLength="47.469" font-family="Arial">Expired</text></g><g class="end_entity" data-qualified-name=".end." id="ent0013" data-source-line="13"><ellipse cx="215.896" cy="432.641" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="215.896" cy="432.